<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Special Question ✨</title>
  
  <!-- Canvas Confetti Engine for Victory Blast -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030108;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Fullscreen Parametric Canvas */
    #bgCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    /* Obsidian Glassmorphism Main Card */
    .card-container {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 440px;
      background: rgba(12, 8, 24, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 45, 85, 0.25);
      border-radius: 28px;
      padding: 38px 28px;
      box-shadow: 
        0 0 50px rgba(255, 45, 85, 0.2),
        0 20px 50px rgba(0, 0, 0, 0.8),
        inset 0 0 20px rgba(255, 45, 85, 0.05);
      text-align: center;
      color: #ffffff;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease;
    }

    /* Photo / Avatar Holder */
    .photo-wrapper {
      position: relative;
      width: 110px;
      height: 110px;
      margin: 0 auto 20px auto;
    }

    .photo-frame {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid #ff2d55;
      box-shadow: 0 0 20px rgba(255, 45, 85, 0.6);
      position: relative;
      z-index: 2;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo-pulse {
      position: absolute;
      top: -5px;
      left: -5px;
      right: -5px;
      bottom: -5px;
      border-radius: 50%;
      border: 2px solid rgba(255, 45, 85, 0.5);
      animation: ringPulse 2s infinite ease-out;
      z-index: 1;
    }

    @keyframes ringPulse {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(1.3); opacity: 0; }
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 14px;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 0%, #ff9ebb 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .typewriter-box {
      font-size: 1.02rem;
      line-height: 1.6;
      color: #d8cfed;
      min-height: 70px;
      margin-bottom: 22px;
      font-weight: 400;
    }

    .question-prompt {
      font-size: 1.15rem;
      font-weight: 700;
      color: #ff2d55;
      margin-bottom: 28px;
      text-shadow: 0 0 12px rgba(255, 45, 85, 0.5);
    }

    /* Button Area */
    .action-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
      position: relative;
      min-height: 54px;
    }

    .btn {
      padding: 14px 34px;
      font-size: 1.05rem;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.25s ease;
      outline: none;
    }

    #yesBtn {
      background: linear-gradient(135deg, #ff2d55 0%, #ff6b81 100%);
      color: #ffffff;
      box-shadow: 0 0 25px rgba(255, 45, 85, 0.5);
      z-index: 2;
    }

    #yesBtn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 35px rgba(255, 45, 85, 0.8);
    }

    #noBtn {
      background: rgba(255, 255, 255, 0.08);
      color: #a8a0c0;
      border: 1px solid rgba(255, 255, 255, 0.15);
      position: absolute;
      right: 15px;
      touch-action: none;
      z-index: 100;
    }

    /* Success Card Overlay */
    .success-card {
      display: none;
    }

    .giant-emoji {
      font-size: 4rem;
      margin-bottom: 10px;
      animation: floatEmoji 2s ease-in-out infinite alternate;
    }

    @keyframes floatEmoji {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-12px) scale(1.1); }
    }

    /* Raining Diamonds & Hearts Overlay */
    #rainOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 5;
      overflow: hidden;
      display: none;
    }

    .rain-item {
      position: absolute;
      top: -60px;
      animation: rainFall linear infinite;
    }

    @keyframes rainFall {
      0% {
        transform: translateY(-60px) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(105vh) rotate(360deg);
        opacity: 0.9;
      }
    }
  </style>
</head>
<body>

  <!-- Fullscreen Neon Vector Canvas -->
  <canvas id="bgCanvas"></canvas>

  <!-- Falling Love & Diamond Rain Overlay -->
  <div id="rainOverlay"></div>

  <!-- Main Card Page 1 -->
  <div class="card-container" id="proposalCard">
    <div class="photo-wrapper">
      <div class="photo-pulse"></div>
      <div class="photo-frame">
        <!-- EDIT YOUR PHOTO LINK HERE -->
        <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=400" alt="Special Memory">
      </div>
    </div>

    <!-- EDIT HER NAME HERE -->
    <h1>Hey Life Partner,</h1>
    
    <div class="typewriter-box" id="typewriter"></div>
    <div class="question-prompt">Will you be my Life Long Life? 💖</div>

    <div class="action-group">
      <button class="btn" id="yesBtn" onclick="acceptProposal()">Yes! ❤️</button>
      <button class="btn" id="noBtn">No 😜</button>
    </div>
  </div>

  <!-- Success Card Page 2 -->
  <div class="card-container success-card" id="successCard">
    <div class="giant-emoji">💍✨💖</div>
    <h1>I Knew You'd Say Yes!</h1>
    <p style="color: #d8cfed; line-height: 1.6; margin-top: 12px;">
      Every line of code and every heartbeat led to this moment. Get ready, we are celebrating soon! 🎉
    </p>
  </div>

  <script>
    // --- 1. Pure HTML5 Parametric Heart Particle Engine ---
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');

    let width, height, heartPoints = [], particles = [];

    function resizeCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      generateHeartPoints();
    }
    window.addEventListener('resize', resizeCanvas);

    // Parametric Mathematical Heart Formula
    function getHeartPoint(t, scale) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      return {
        x: width / 2 + x * scale,
        y: height / 2 + y * scale
      };
    }

    function generateHeartPoints() {
      heartPoints = [];
      const scale = Math.min(width, height) / 45; // Auto responsive sizing
      for (let t = 0; t < Math.PI * 2; t += 0.03) {
        heartPoints.push(getHeartPoint(t, scale));
      }
    }

    // Background Floating Ambient Dust
    for (let i = 0; i < 60; i++) {
      particles.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        size: Math.random() * 2 + 1,
        speedY: -(Math.random() * 0.5 + 0.2),
        opacity: Math.random() * 0.7 + 0.3
      });
    }

    let heartProgress = 0;

    function renderCanvas() {
      ctx.fillStyle = 'rgba(3, 1, 8, 0.2)'; // Smooth motion blur trail
      ctx.fillRect(0, 0, width, height);

      // Render Ambient Stars
      particles.forEach(p => {
        p.y += p.speedY;
        if (p.y < 0) p.y = height;
        ctx.fillStyle = `rgba(255, 158, 187, ${p.opacity})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });

      // Draw Glowing Multi-Layer Heart Path
      if (heartPoints.length > 0) {
        ctx.save();
        ctx.shadowBlur = 18;
        ctx.shadowColor = '#ff2d55';
        ctx.lineWidth = 2.5;

        // Draw active outline up to current progress
        const count = Math.min(Math.floor(heartProgress), heartPoints.length);
        
        for (let i = 1; i < count; i++) {
          const ratio = i / heartPoints.length;
          // Dynamic Hue gradient along the heart curve
          ctx.strokeStyle = `hsl(${340 + ratio * 30}, 100%, 65%)`;
          ctx.beginPath();
          ctx.moveTo(heartPoints[i - 1].x, heartPoints[i - 1].y);
          ctx.lineTo(heartPoints[i].x, heartPoints[i].y);
          ctx.stroke();
        }

        ctx.restore();

        // Increment heart drawing animation loop
        if (heartProgress < heartPoints.length) {
          heartProgress += 0.8; // Drawing speed
        } else {
          // Subtle pulse once drawn
          heartProgress = heartPoints.length;
        }
      }

      requestAnimationFrame(renderCanvas);
    }

    resizeCanvas();
    renderCanvas();

    // --- 2. Typewriter Message ---
    // EDIT YOUR PERSONALIZED PARAGRAPH HERE
    const messageText = "Having you in my life makes everything brighter. I built this tiny interactive piece of code just to ask you one real question...";
    let charIndex = 0;

    function typeWriter() {
      if (charIndex < messageText.length) {
        document.getElementById('typewriter').innerHTML += messageText.charAt(charIndex);
        charIndex++;
        setTimeout(typeWriter, 32);
      }
    }
    window.addEventListener('load', typeWriter);

    // --- 3. Funny Dodging "No" Button with Changing Captions ---
    const noBtn = document.getElementById('noBtn');
    const funnyCaptions = [
      "No 😜", 
      "Nice try! 😂", 
      "Too slow! ⚡", 
      "Not an option! 🙈", 
      "Wrong button! 🚀", 
      "Ops, missed me! 😜"
    ];
    let captionIndex = 0;

    function dodgeNoButton(e) {
      if (e) e.preventDefault();
      
      const padding = 35;
      const maxX = window.innerWidth - noBtn.offsetWidth - padding;
      const maxY = window.innerHeight - noBtn.offsetHeight - padding;

      const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
      const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

      noBtn.style.position = 'fixed';
      noBtn.style.left = `${randomX}px`;
      noBtn.style.top = `${randomY}px`;

      // Cycle text on dodging
      captionIndex = (captionIndex + 1) % funnyCaptions.length;
      noBtn.innerText = funnyCaptions[captionIndex];
    }

    noBtn.addEventListener('mouseover', dodgeNoButton);
    noBtn.addEventListener('touchstart', dodgeNoButton);
    noBtn.addEventListener('click', dodgeNoButton);

    // --- 4. Acceptance Handler ---
    function acceptProposal() {
      document.getElementById('proposalCard').style.display = 'none';
      document.getElementById('successCard').style.display = 'block';

      playVictoryAudio();
      fireConfetti();
      startRainOverlay();
    }

    // --- 5. Web Audio Victory Fanfare Synthesizer ---
    function playVictoryAudio() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50]; // Sweet Arpeggio
        
        notes.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.value = freq;

          osc.connect(gain);
          gain.connect(ctx.destination);

          const startTime = ctx.currentTime + i * 0.07;
          osc.start(startTime);
          gain.gain.setValueAtTime(0.25, startTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.5);
          osc.stop(startTime + 0.5);
        });
      } catch (e) {}
    }

    // --- 6. Confetti Explosion ---
    function fireConfetti() {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 120,
          spread: 80,
          origin: { y: 0.6 }
        });
      }
    }

    // --- 7. Love & Diamond Rain Engine ---
    function startRainOverlay() {
      const overlay = document.getElementById('rainOverlay');
      overlay.style.display = 'block';

      const items = ['💍', '💖', '💎', '❤️', '✨', '💍', '💕'];

      setInterval(() => {
        const drop = document.createElement('div');
        drop.classList.add('rain-item');
        drop.innerText = items[Math.floor(Math.random() * items.length)];
        drop.style.left = Math.random() * 100 + 'vw';
        drop.style.fontSize = (Math.random() * 20 + 22) + 'px';

        const fallDuration = Math.random() * 2 + 2.5;
        drop.style.animationDuration = fallDuration + 's';

        overlay.appendChild(drop);

        setTimeout(() => drop.remove(), fallDuration * 1000);
      }, 100);
    }
  </script>
</body>
</html>
